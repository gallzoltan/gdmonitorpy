[project]
name = "gdmonitor"
version = "0.1.0"
description = "Monitoring tool for the Hungarian Government Gazette (Hivatalos Közlöny)"
readme = "README.md"
authors = [
    { name = "Gáll Zoltán", email = "gallzoltan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "certifi>=2025.7.14",
    "pdfplumber>=0.11.6",
    "python-dotenv>=1.1.0",
    "requests>=2.32.4",
]

[project.scripts]
gdmonitor = "gdmodule.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdmodule"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "fpdf>=1.7.2",
    "pip>=25.1.1",
    "pytest>=8.3.5",
]
